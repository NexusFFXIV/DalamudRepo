# Regenerate when asked: Akurosia/MyCustomDalamudPluginRepoCollection
# (repo_urls.json) is the main aggregator; puni.sh/directory/repositories
# lists the puni.sh ones; GitHub code-search for `TestingDalamudApiLevel
# extension:json` and `Punchline AssemblyVersion` surfaces stragglers.
# Always re-validate HTTP status before annotating unreachable. URLs listed in
# `offline-repos.yml` are authoritative: if a pull request re-adds one, the
# generator removes the duplicate automatically and keeps the URL archived
# until its original source is reachable again.

