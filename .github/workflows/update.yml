name: Update pluginmaster

# Three triggers, all converge on the same rebuild step:
#   - repository_dispatch  : sent by a plugin repo's release workflow on tag push (real-time update).
#                            Its client_payload.plugin is forwarded to the build as -ForcePlugin, so
#                            the plugin that just published is always republished in full.
#   - workflow_dispatch    : manual button in the Actions UI, with optional force inputs.
#   - schedule (daily)     : safety net for missed dispatches + drift in external upstream pools.
#
# The cadence used to be 48h to dampen fake "refresh" PRs: upstream download
# counters tick constantly, and every tick rewrote an entry. That is now handled
# at the source — build-outputs.ps1 keeps the previously published entry verbatim
# when only volatile fields moved, so a quiet run produces no commit at all. With
# the noise gone a daily cadence is affordable again and real upstream releases
# show up sooner.
#
# Also note the old '0 0 */2 * *' was not actually every 48h: day-of-month steps
# restart each month, so it fired on days 1,3,…,31 and the 31st->1st gap was 24h.

on:
  repository_dispatch:
    types: [plugin-release]
  workflow_dispatch:
    inputs:
      force_refresh:
        description: 'Adopt fresh DownloadCounts even for otherwise-unchanged entries (large diff)'
        type: boolean
        default: false
      force_plugin:
        description: 'InternalName to republish in full (blank = none)'
        type: string
        default: ''
  schedule:
    - cron: '0 0 * * *'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  rebuild:
    runs-on: ubuntu-latest
    permissions:
      contents: write          # for pushing the bot branch
      pull-requests: write     # for opening + auto-merging the refresh PR
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Rebuild pluginmaster.json
        # Capture all output streams (incl. Write-Host) via Start-Transcript so
        # the email step downstream can attach the structured build log.
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Passed as env, never interpolated into the script body: client_payload
          # is attacker-shaped input (anyone holding a token that can dispatch this
          # repo controls it), and ${{ }} inside `run:` is textual substitution —
          # a payload like '; <arbitrary pwsh>; ' would execute.
          # On `schedule` both render empty, so cron never forces.
          FORCE_PLUGIN: ${{ github.event.client_payload.plugin || inputs.force_plugin }}
          FORCE_ALL: ${{ inputs.force_refresh }}
        run: |
          $buildArgs = @{}
          if (-not [string]::IsNullOrWhiteSpace($env:FORCE_PLUGIN)) { $buildArgs.ForcePlugin = $env:FORCE_PLUGIN }
          if ($env:FORCE_ALL -eq 'true') { $buildArgs.ForceAll = $true }
          Start-Transcript -Path build.log -IncludeInvocationHeader:$false | Out-Null
          try {
            ./scripts/build-pluginmaster.ps1 @buildArgs
          } finally {
            Stop-Transcript | Out-Null
          }

      - name: Open PR if changed
        # main is branch-protected (PR required). The bot pushes its diff to a
        # short-lived branch and opens a PR, which auto-merges once GitHub
        # confirms it satisfies the protection rules (no CI checks are required
        # for this repo, only the PR-must-exist gate).
        # Diff covers all five pluginmaster outputs plus snapshot.json — a
        # change in any of them triggers a refresh PR. Including snapshot.json
        # in the diff makes the zip-fallback cache durable: new (plugin,
        # version) entries get persisted on the same run that needed them.
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Via env, not ${{ }} inside the script: client_payload is untrusted
          # input and ${{ }} in a `run:` block is textual substitution, so a
          # crafted payload could break out of the quotes and execute.
          DISPATCH_PAYLOAD: ${{ toJSON(github.event.client_payload) }}
          TRIGGERED_BY: ${{ github.event_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          PM_FILES="pluginmaster.json external-repo.json common-repo.json gen-repo.json all-repo.json"
          TRACKED_FILES="$PM_FILES cache/snapshot.json"
          # Stage first so newly-created files (not in HEAD) also show up in
          # the diff — plain `git diff` would miss untracked outputs.
          git add -- $TRACKED_FILES
          if git diff --cached --quiet -- $TRACKED_FILES; then
            echo "No changes — nothing to commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          BRANCH="bot/refresh-pluginmaster-${{ github.run_id }}"
          git checkout -b "$BRANCH"
          git add -- $TRACKED_FILES
          git commit -m "chore: refresh pluginmaster.json" \
                     -m "Triggered by: $TRIGGERED_BY" \
                     -m "Payload: $DISPATCH_PAYLOAD"
          git push origin "$BRANCH"
          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "chore: refresh pluginmaster.json" \
            --body "Auto-generated by the \`update\` workflow.

          Triggered by: \`${{ github.event_name }}\`
          Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          # Direct merge — DalamudRepo has no required CI checks, so --auto
          # would just queue a merge that resolves immediately anyway. We tried
          # that pattern (--auto || direct) and it left bot branches orphaned:
          # the --auto path occasionally accepted the call silently (queueing
          # the merge) but never honored the delete-branch preference, so the
          # fallback never ran and the branch stayed behind. Direct merge with
          # --delete-branch deletes reliably.
          gh pr merge "$BRANCH" --squash --delete-branch

      - name: Email notification on change
        # Skipped silently if either the file didn't change OR the SMTP_HOST
        # repo secret isn't configured yet (so the workflow doesn't fail until
        # the user is ready to receive mails).
        # Required repo secrets: SMTP_HOST, SMTP_PORT, SMTP_USERNAME,
        # SMTP_PASSWORD, MAIL_TO.
        if: steps.pr.outputs.changed == 'true' && env.SMTP_HOST != ''
        uses: dawidd6/action-send-mail@v18
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
        with:
          server_address: ${{ secrets.SMTP_HOST }}
          server_port: ${{ secrets.SMTP_PORT }}
          # Port 587 uses STARTTLS (secure:false); port 465 wants implicit TLS
          # (secure:true). Gmail on 587 → STARTTLS, so keep this false.
          secure: false
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          to: ${{ secrets.MAIL_TO }}
          from: NexusFFXIV DalamudRepo Bot <${{ secrets.SMTP_USERNAME }}>
          subject: "NexusFFXIV [DalamudRepo] pluginmaster.json refreshed (${{ github.event_name }})"
          body: file://build.log
          attachments: pluginmaster.json,external-repo.json,common-repo.json,gen-repo.json,all-repo.json
